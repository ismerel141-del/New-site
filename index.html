<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviebox Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="logo">MOVIE<span>BOX</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for movies...">
            <button id="searchBtn">Search</button>
        </div>
    </header>

    <!-- Main Feature Cinematic Hero Banner -->
    <section class="hero-banner" id="heroBanner">
        <div class="hero-content">
            <h1 id="heroTitle">Loading Featured Content...</h1>
            <p id="heroOverview"></p>
            <button class="play-btn" id="heroPlayBtn">▶ Watch Trailer</button>
        </div>
    </section>

    <!-- Dynamic Movie Cards Showcase Grid -->
    <main class="container">
        <h2 id="sectionTitle">Trending Now</h2>
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic movie cards will inject here via javascript -->
        </div>
    </main>

    <!-- Embedded Video Streaming Overlay -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
