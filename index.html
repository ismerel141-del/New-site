<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviebox App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #ffffff; font-family: system-ui, sans-serif; padding-top: 70px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: #0b0c10; border-bottom: 1px solid #1f2833; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: #e50914; }
        .search-bar { display: flex; width: 60%; max-width: 400px; }
        .search-bar input { flex: 1; padding: 10px; background-color: #1f2833; border: 1px solid #45a29e; border-radius: 4px 0 0 4px; color: #fff; outline: none; }
        .search-bar button { padding: 10px 15px; background-color: #e50914; color: #fff; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }
        .hero-banner { height: 45vh; background-size: cover; background-position: center top; display: flex; align-items: flex-end; padding: 30px 5%; position: relative; }
        .hero-banner::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, #0b0c10 15%, transparent 85%); }
        .hero-content { position: relative; z-index: 2; max-width: 500px; }
        .hero-content h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .hero-content p { font-size: 0.9rem; color: #c5a059; margin-bottom: 15px; line-height: 1.4; }
        .play-btn { background-color: #e50914; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .container { padding: 25px 5%; }
        .container h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .movie-card { background-color: #1f2833; border-radius: 6px; overflow: hidden; cursor: pointer; }
        .movie-card img { width: 100%; height: 190px; object-fit: cover; }
        .movie-info { padding: 8px; }
        .movie-info h3 { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">MOVIE<span>BOX</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for movies...">
            <button id="searchBtn">Search</button>
        </div>
    </header>

    <section class="hero-banner" id="heroBanner">
        <div class="hero-content">
            <h1 id="heroTitle">Moviebox Loading...</h1>
            <p id="heroOverview">Connecting directly to secure streaming database matrix...</p>
            <button class="play-btn" id="heroPlayBtn">▶ Watch Trailer</button>
        </div>
    </section>

    <main class="container">
        <h2 id="sectionTitle">Trending Now</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </main>

    <script>
        const API_KEY = 'a83a16584e228d5eaaa7f34ada3c3566'; 
const BASE_URL = 'https://tmdb.org'; // FIXED: Swapped to unblocked mirror server
const IMG_URL = 'https://tmdb.org';

        window.onload = function() {
            getTrendingMovies();
            setupEventListeners();
        };

        function setupEventListeners() {
            var btn = document.getElementById('searchBtn');
            if (btn) btn.onclick = handleSearch;
            var input = document.getElementById('searchInput');
            if (input) {
                input.addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') handleSearch();
                });
            }
        }

        function getTrendingMovies() {
    var statusText = document.getElementById('heroOverview');
    
    fetch(BASE_URL + '/trending/movie/week?api_key=' + API_KEY)
        .then(function(res) { 
            if (!res.ok) {
                if (statusText) statusText.innerText = "Network Error Code: " + res.status;
            }
            return res.json(); 
        })
        .then(function(data) {
            if (data && data.results && data.results.length > 0) {
                setupHeroBanner(data.results[0]); 
                displayMovies(data.results);
            } else {
                if (statusText) statusText.innerText = "Server replied, but gave 0 movies.";
            }
        })
        .catch(function(err) { 
            console.error(err); 
            if (statusText) {
                statusText.style.color = "#ff4d4d";
                statusText.innerHTML = "<strong>📡 CONNECTION BLOCKED:</strong> Your browser or network provider is blocking the connection to the movie database servers. Try switching to a different network/Wi-Fi or use a VPN.";
            }
        });
}


        function handleSearch() {
            var query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            var titleNode = document.getElementById('sectionTitle');
            if (titleNode) titleNode.innerText = 'Search Results for "' + query + '"';
            fetch(BASE_URL + '/search/movie?api_key=' + API_KEY + '&query=' + encodeURIComponent(query))
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data && data.results) { displayMovies(data.results); }
                })
                .catch(function(err) { console.error(err); });
        }

        function setupHeroBanner(movie) {
            var banner = document.getElementById('heroBanner');
            if (!banner || !movie) return;
            banner.style.backgroundImage = "url('https://tmdb.org" + movie.backdrop_path + "')";
            document.getElementById('heroTitle').innerText = movie.title;
            document.getElementById('heroOverview').innerText = movie.overview ? movie.overview.substring(0, 120) + '...' : '';
            document.getElementById('heroPlayBtn').onclick = function() { playMovieTrailer(movie.title); };
        }

        function displayMovies(movies) {
            var grid = document.getElementById('movieGrid');
            if (!grid) return;
            grid.innerHTML = '';
            if (movies.length === 0) {
                grid.innerHTML = '<p style="padding: 20px; color: #888;">No results found.</p>';
                return;
            }
            movies.forEach(function(movie) {
                if (!movie.poster_path) return; 
                var card = document.createElement('div');
                card.classList.add('movie-card');
                card.onclick = function() { playMovieTrailer(movie.title); };
                card.innerHTML = '<img src="' + IMG_URL + movie.poster_path + '" alt="' + movie.title + '"><div class="movie-info"><h3>' + movie.title + '</h3><span style="color: #ffc107; font-size: 0.8rem;">★ ' + (movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A') + '</span></div>';
                grid.appendChild(card);
            });
        }

        function playMovieTrailer(movieTitle) {
            var cleanTitle = encodeURIComponent(movieTitle + ' official trailer');
            window.open('https://youtube.com' + cleanTitle, '_blank');
        }
    </script>
</body>
</html>
