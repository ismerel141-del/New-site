<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviebox App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">MOVIE<span>BOX</span></div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for movies...">
            <button id="searchBtn">Search</button>
        </div>
    </header>

    <section class="hero-banner" id="heroBanner">
        <div class="hero-content">
            <h1 id="heroTitle">Moviebox Loading...</h1>
            <p id="heroOverview">Fetching active media streams from database servers...</p>
            <button class="play-btn" id="heroPlayBtn">▶ Watch Trailer</button>
        </div>
    </section>

    <main class="container">
        <h2 id="sectionTitle">Trending Now</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
